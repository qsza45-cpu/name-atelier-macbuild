<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'none'" />
    <title>NAME ATELIER — 작명 아틀리에</title>
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/license.css" />
  </head>
  <body>
    <main class="lic">
      <div class="brand">
        <img class="symbol" src="design/logo_symbol.png" alt="" />
        <img class="wordmark light-only" src="design/logo_wordmark_dark.png" alt="NAME ATELIER" />
        <img class="wordmark dark-only" src="design/logo_wordmark_light.png" alt="NAME ATELIER" />
      </div>
      <p class="sub">작명 아틀리에 · 웹소설 캐릭터 이름 공방</p>

      <section class="card" aria-labelledby="lic-title">
        <h1 id="lic-title">인증키 입력</h1>
        <p class="lead">받으신 인증키를 붙여 넣어 주세요. 한 번 인증하면 다음부터는 묻지 않습니다.</p>
        <p class="notice" id="notice" hidden></p>
        <form id="form">
          <label for="key" class="sr-only">인증키</label>
          <textarea id="key" rows="4" spellcheck="false" autocomplete="off" placeholder="NA1-XXXXXX-XXXXXX-…" autofocus></textarea>
          <div class="msg" id="msg" role="alert" aria-live="assertive"></div>
          <div class="buttons">
            <button type="button" id="paste">붙여넣기</button>
            <button type="submit" id="submit" class="primary">인증하기</button>
          </div>
        </form>
        <p class="help">같은 인증키를 여러 컴퓨터에서 쓸 수 있습니다.<br />인터넷 연결 없이 이 컴퓨터에서 확인합니다.</p>
      </section>
    </main>
    <script src="license.js"></script>
  </body>
</html>
